name: Fix double-encoded launcher icons
on:
  push:
    branches: [fix/launcher-icon-binary]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launcher-icon-binary
      - name: Decode base64-encoded WebP files in place
        run: |
          fixed=0
          for f in app/src/main/res/mipmap-*/ic_launcher.webp \
                   app/src/main/res/mipmap-*/ic_launcher_round.webp \
                   app/src/main/res/mipmap-*/ic_launcher_foreground.webp; do
            [ -f "$f" ] || continue
            if [ "$(head -c 4 "$f")" = "UklG" ]; then
              base64 -d "$f" > "$f.tmp" && mv "$f.tmp" "$f"
              echo "fixed: $f"
              fixed=$((fixed+1))
            else
              echo "already binary: $f"
            fi
          done
          echo "fixed_count=$fixed"
      - name: Commit fixed binaries and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-icon-encoding.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "[skip ci] fix: decode double-encoded launcher icon WebPs to real binaries"
            git push origin fix/launcher-icon-binary
          fi
